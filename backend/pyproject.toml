[project]
name = "enamel-backend"
version = "0.1.0"
description = "Enamel dental platform API (Django 6.1)"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.6",
    "dj-database-url==3.1.2",
    "celery==5.6.3",
    "redis==8.1.0",
    "django-cors-headers==4.9.0",
    "drf-spectacular==0.30.0",
    "whitenoise==6.12.0",
    "django-csp==4.0",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.4",
    "pgvector==0.5.1",
    "pyotp==2.10.0",
    "cryptography==46.0.3",
    "phonenumbers==9.0.41",
    "reportlab==5.0.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "fhir.resources==7.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pandas==3.0.6",
    "pydicom==3.0.2",
    "pillow==13.0.0",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "kombu==5.6.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F403", "F405"]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers --disable-socket --allow-hosts=127.0.0.1,localhost"
markers = [
    "rls: exercises the PostgreSQL row-level-security policies directly. Needs a superuser test connection; without one the module skips loudly. Set ENAMEL_REQUIRE_RLS=1 to turn that skip into a hard failure.",
]
