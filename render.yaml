# Render Blueprint for the Enamel demo.
#
# ONE free web service serves the SPA and the API same-origin in a single
# container (nginx -> gunicorn; see deploy/render/Dockerfile). The background
# worker is NOT in this container: it runs in the bounded scheduled GitHub
# Actions window (.github/workflows/worker.yml) against the same database,
# with the enamel_worker credential. Postgres and Redis are external:
#
#   Postgres: Supabase free (pgvector available, no card, roles can be created)
#   Redis:    Upstash free (TLS, no card)
#
# Credential boundary: DATABASE_URL and REDIS_URL that you paste when Render
# asks for them MUST be the enamel_app session-pooler URL and the Upstash TLS
# URL - never a database owner/migration URL. Migrations stay OFF in the web
# service (RUN_MIGRATIONS=0); the schema and the runtime roles are applied
# once by an operator with an owner credential before the first boot, and the
# demo role passwords are set with deploy/cloud/supabase_bootstrap.sql (see
# docs/deployment/DEPLOYMENT_GUIDE.md, sections 2-3).
#
# Setup: https://render.com -> New -> Blueprint -> select this repository.
# Then paste the enamel_app DATABASE_URL, the REDIS_URL, and your exact
# service hostname/origin when Render asks for them. The full walkthrough is
# in docs/deployment/DEPLOYMENT_GUIDE.md.

services:
  - type: web
    name: enamel-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.demo
      - key: DEMO_MODE
        value: "true"
      # Generated by Render; the demo settings require all three secrets.
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: MESSAGING_WEBHOOK_SECRET
        generateValue: true
      # The enamel_app session-pooler URL (the enamel_app role; never the
      # owner and never a migration URL) and the Upstash TLS URL.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Exact deployed hostname and origin. Keep the onrender.com host for
      # Render health checks and direct access; the custom domain is the
      # public browser origin. No wildcard is accepted.
      - key: ALLOWED_HOSTS
        value: enamel-demo-nj6w.onrender.com,enamel.aakifmudel.xyz,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://enamel-demo-nj6w.onrender.com,https://enamel.aakifmudel.xyz
      - key: FRONTEND_BASE_URL
        value: https://enamel.aakifmudel.xyz
      # Enforce HTTPS in Django (prod settings exempt /healthz and /readyz
      # from the redirect so the container's own probes stay on plain HTTP;
      # the nginx template passes through Render's X-Forwarded-Proto).
      # Render's Force HTTPS setting remains the edge control.
      - key: SECURE_SSL_REDIRECT
        value: "true"
      # Supabase/Neon poolers do not support server-side cursors.
      - key: DB_DISABLE_SERVER_SIDE_CURSORS
        value: "1"
      # Migrations must NOT run from the web service: it connects as the
      # non-owner enamel_app role, which holds no DDL grant by design. The
      # schema is applied once by an operator with an owner credential before
      # the first boot (docs/deployment/DEPLOYMENT_GUIDE.md, sections 2-3).
      - key: RUN_MIGRATIONS
        value: "0"
      # The synthetic demo data is seeded once, before first boot, from an
      # owner/migration-credentialed environment - NOT from the web service.
      # The enamel_app role must not seed data across tenants.
      - key: SEED_DEMO
        value: "0"
      # The web service connects as enamel_app with FORCED row-level security
      # (never the owner; forced RLS stays on). This must stay 0; setting it
      # to 1 would disable FORCE ROW LEVEL SECURITY on the hosted database.
      - key: DEMO_SINGLE_ROLE
        value: "0"
      # The free instance is 512 MB: nginx + gunicorn fit, a second Django
      # process does not, and the worker runs externally anyway
      # (.github/workflows/worker.yml). Keep it 0.
      - key: ENABLE_WORKER
        value: "0"
