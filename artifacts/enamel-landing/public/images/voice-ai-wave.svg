<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" aria-label="Abstract layered waveform illustration">
  <!--
    Original project artwork (synthetic, abstract).
    A layered waveform illustration for the landing page.
    It is NOT a recording or render of a real voice signal.
  -->
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060d"/>
      <stop offset="0.5" stop-color="#0a0b16"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4647d3"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4647d3"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7bff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="waveFillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4647d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6d7bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#border)"/>
  <rect width="1600" height="900" fill="url(#centerGlow)"/>

  <!-- horizontal guide grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="270" x2="1600" y2="270"/>
    <line x1="0" y1="630" x2="1600" y2="630"/>
  </g>

  <!-- soft blurred halo behind the main wave -->
  <g filter="url(#blurBig)" opacity="0.5">
    <path
      d="M0 470 C 100 300, 180 620, 280 470 C 380 320, 460 660, 560 470 C 660 280, 740 640, 840 470 C 940 300, 1020 600, 1120 470 C 1220 340, 1300 620, 1400 470 C 1480 350, 1540 520, 1600 470"
      fill="none" stroke="#8b5cf6" stroke-width="18" stroke-linecap="round"/>
    <path
      d="M0 450 C 120 560, 200 340, 300 450 C 400 560, 500 330, 600 450 C 700 560, 800 320, 900 450 C 1000 560, 1100 330, 1200 450 C 1300 560, 1400 340, 1500 450 L 1600 450"
      fill="none" stroke="#6d7bff" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- filled band under the primary layer -->
  <path
    d="M0 470 C 100 300, 180 620, 280 470 C 380 320, 460 660, 560 470 C 660 280, 740 640, 840 470 C 940 300, 1020 600, 1120 470 C 1220 340, 1300 620, 1400 470 C 1480 350, 1540 520, 1600 470 L 1600 900 L 0 900 Z"
    fill="url(#waveFillA)"/>

  <!-- primary waveform -->
  <path
    d="M0 470 C 100 300, 180 620, 280 470 C 380 320, 460 660, 560 470 C 660 280, 740 640, 840 470 C 940 300, 1020 600, 1120 470 C 1220 340, 1300 620, 1400 470 C 1480 350, 1540 520, 1600 470"
    fill="none" stroke="url(#waveA)" stroke-width="5" stroke-linecap="round"/>

  <!-- secondary waveform -->
  <path
    d="M0 450 C 120 560, 200 340, 300 450 C 400 560, 500 330, 600 450 C 700 560, 800 320, 900 450 C 1000 560, 1100 330, 1200 450 C 1300 560, 1400 340, 1500 450 L 1600 450"
    fill="none" stroke="url(#waveB)" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- filled band above the secondary layer -->
  <path
    d="M0 450 C 120 560, 200 340, 300 450 C 400 560, 500 330, 600 450 C 700 560, 800 320, 900 450 C 1000 560, 1100 330, 1200 450 C 1300 560, 1400 340, 1500 450 L 1600 450 L 1600 0 L 0 0 Z"
    fill="url(#waveFillB)"/>

  <!-- tertiary high-frequency trace -->
  <path
    d="M0 430 C 40 430, 60 380, 100 380 C 140 380, 160 500, 200 500 C 240 500, 260 420, 300 420 C 340 420, 360 360, 400 360 C 440 360, 460 520, 500 520 C 540 520, 560 440, 600 440 C 640 440, 660 380, 700 380 C 740 380, 760 510, 800 510 C 840 510, 860 420, 900 420 C 940 420, 960 370, 1000 370 C 1040 370, 1060 500, 1100 500 C 1140 500, 1160 430, 1200 430 C 1240 430, 1260 380, 1300 380 C 1340 380, 1360 490, 1400 490 C 1440 490, 1460 440, 1500 440 C 1540 440, 1560 420, 1600 420"
    fill="none" stroke="#c4b5fd" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- pulse markers -->
  <g fill="#8b5cf6" fill-opacity="0.6" filter="url(#blurSmall)">
    <circle cx="420" cy="336" r="6"/>
    <circle cx="1180" cy="470" r="6"/>
    <circle cx="840" cy="336" r="5"/>
  </g>
</svg>
