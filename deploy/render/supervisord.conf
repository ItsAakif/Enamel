; Render single-container process set.
;
; gunicorn on loopback, one Celery worker with the scheduler embedded (the
; free plan has no separate worker or cron service), nginx on $PORT.
; Memory budget: the free instance is 512 MB, so one worker, two threads and
; Celery concurrency 1 are deliberate. nginx is additionally capped to a
; single worker process by start.sh (it replaces nginx's own
; `worker_processes auto`, which measured about 60 MB as a master + 16
; workers); raise it back on a larger instance.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:gunicorn]
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 2 --timeout 120
directory=/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- celery begin ---
; The free Render instance is 512 MB, which fits nginx + gunicorn but not a
; second Django process. start.sh removes this block when ENABLE_WORKER=0
; (the value used by render.yaml) and keeps it on a 1 GB+ instance.
[program:celery]
command=celery -A config worker -B -l info -Q default,reminders,ai,ml,sync --pool=solo --concurrency=1
directory=/app
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; --- celery end ---

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
