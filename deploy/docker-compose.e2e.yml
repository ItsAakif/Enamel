# E2E-only override for the production-shaped compose stack.
#
# The Playwright workflows run against the real stack (nginx, gunicorn, Celery,
# Postgres) but need the development settings so the portal OTP code can be
# read back by the harness:
#
#   * ``config.settings.prod`` refuses to start with DEBUG enabled and never
#     echoes an OTP, which is correct for deployment and impossible to drive in
#     an automated journey;
#   * ``config.settings.dev`` renders the same routes, permissions, RLS and
#     durable jobs, but allows DEBUG and PORTAL_OTP_ECHO.
#
# Usage (from the repository root):
#
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.e2e.yml --profile prod up -d --build
#
# This file must never be used for a real deployment.
name: enamel

services:
  api:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "true"
      PORTAL_OTP_ECHO: "true"

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "true"
      PORTAL_OTP_ECHO: "true"

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "true"
      PORTAL_OTP_ECHO: "true"
