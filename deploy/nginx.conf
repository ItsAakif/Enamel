# Enamel production web tier.
# Serves the built SPA and proxies API/auth/media traffic to the api container.
# TLS is terminated by an upstream load balancer (out of scope for this file);
# X-Forwarded-Proto is preserved for Django's SECURE_PROXY_SSL_HEADER.

server {
    listen 80;
    server_name _;

    # Resolve the api container per request through Docker's embedded DNS, so
    # a redeployed api (new container, new address) is picked up automatically
    # instead of leaving nginx pinned to the previous address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enamel_api_upstream "api:8000";

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    server_tokens off;

    # Baseline headers for every static/SPA response. Django sets the same set
    # (plus its own CSP) on proxied responses; duplicate headers are harmless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django owns health/readiness so the probe covers the database and Redis.
    location = /healthz {
        proxy_pass http://$enamel_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /readyz {
        proxy_pass http://$enamel_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        proxy_pass http://$enamel_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # The platform admin is NOT served here (ADR-013, decision D-1). It is a
    # separately permissioned service on its own port, with its own
    # credential, and the public web tier must not be a way in. The path is
    # closed explicitly instead of falling through to the SPA shell.
    location /admin/ {
        return 404;
    }

    location /static/ {
        proxy_pass http://$enamel_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded PHI is served from the shared media volume, never from the SPA
    # build. Access remains mediated by Django-issued signed URLs.
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Hashed Vite assets are immutable. Any location with its own add_header
    # loses the server-level set, so repeat the security headers here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Client-side routes (/app, /portal, /book) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
